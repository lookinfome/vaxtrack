services:
  api:
    build: .
    ports:
      - "5119:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=vaxtrack_sqlserver;User Id=sa;Password=***REMOVED-SQL-PASSWORD***;TrustServerCertificate=True;Encrypt=False
    volumes:
      - uploads_data:/app/wwwroot/uploads

volumes:
  uploads_data:
