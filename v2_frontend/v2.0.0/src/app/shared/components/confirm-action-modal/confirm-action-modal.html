<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">

    <div class="h-1"
      [class]="accentColor() === 'teal' ? 'bg-gradient-to-r from-teal-400 to-teal-600'
             : accentColor() === 'emerald' ? 'bg-gradient-to-r from-emerald-400 to-emerald-600'
             : accentColor() === 'amber' ? 'bg-gradient-to-r from-amber-400 to-amber-600'
             : 'bg-gradient-to-r from-red-400 to-red-600'">
    </div>

    <div class="px-6 py-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
          [class]="accentColor() === 'teal' ? 'bg-teal-50'
                 : accentColor() === 'emerald' ? 'bg-emerald-50'
                 : accentColor() === 'amber' ? 'bg-amber-50'
                 : 'bg-red-50'">
          <svg class="w-5 h-5"
            [class]="accentColor() === 'teal' ? 'text-teal-500'
                   : accentColor() === 'emerald' ? 'text-emerald-500'
                   : accentColor() === 'amber' ? 'text-amber-500'
                   : 'text-red-500'"
            fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-slate-900">{{ title() }}</h3>
          <p class="text-xs text-slate-500 mt-0.5">This action cannot be undone</p>
        </div>
      </div>

      <p class="text-sm text-slate-600 mb-4">{{ message() }}</p>

      @if (showCommentBox()) {
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            Comment @if (commentRequired()) { <span class="text-red-400">*</span> }
          </label>
          <textarea [(ngModel)]="comment" rows="3" placeholder="Add a note for the user..."
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-900
                   focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white transition-all duration-200"></textarea>
          @if (commentInvalid) {
            <p class="mt-1.5 text-xs text-red-500">A comment is required for this action.</p>
          }
        </div>
      }

      <div class="flex gap-3">
        <button (click)="dismiss()"
          class="flex-1 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all duration-200">
          {{ cancelLabel() }}
        </button>
        <button (click)="confirm()" [disabled]="commentInvalid"
          class="flex-1 py-2.5 text-sm font-semibold text-white rounded-xl shadow-md transition-all duration-200 cursor-pointer active:scale-[0.98] disabled:opacity-50"
          [class]="accentColor() === 'teal' ? 'bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 shadow-teal-500/25'
                 : accentColor() === 'emerald' ? 'bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 shadow-emerald-500/25'
                 : accentColor() === 'amber' ? 'bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 shadow-amber-500/25'
                 : 'bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 shadow-red-500/25'">
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
