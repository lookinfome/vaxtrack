<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
    <div class="h-1 bg-gradient-to-r from-red-400 to-red-600"></div>

    <div class="px-6 py-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-slate-900">Authorize Unregistration</h3>
          <p class="text-xs text-slate-500 mt-0.5">This action cannot be undone</p>
        </div>
      </div>

      <p class="text-sm text-slate-600 mb-4">
        Confirm the permanent removal of <span class="font-semibold text-slate-800">{{ hospitalName() }}</span> by
        re-entering your password.
      </p>

      @if (error()) {
        <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-600">{{ error() }}</div>
      }

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Your Password <span class="text-red-400">*</span></label>
        <input type="password" [(ngModel)]="password" placeholder="Enter your password"
          class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-900
                 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white transition-all duration-200" />
      </div>

      <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Comment (optional)</label>
        <textarea [(ngModel)]="comment" rows="2" placeholder="Add a closing note..."
          class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-900
                 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white transition-all duration-200"></textarea>
      </div>

      <div class="flex gap-3">
        <button (click)="dismiss()" [disabled]="loading()"
          class="flex-1 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all duration-200 disabled:opacity-50">
          Cancel
        </button>
        <button (click)="confirm()" [disabled]="!password() || loading()"
          class="flex-1 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-red-500 to-red-600
                 hover:from-red-600 hover:to-red-700 disabled:opacity-50 rounded-xl shadow-md shadow-red-500/25
                 transition-all duration-200 cursor-pointer active:scale-[0.98]">
          {{ loading() ? 'Confirming...' : 'Confirm Unregistration' }}
        </button>
      </div>
    </div>
  </div>
</div>
