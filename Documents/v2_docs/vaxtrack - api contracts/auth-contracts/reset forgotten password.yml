info:
  name: reset forgotten password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/api/vaxtrack/v1/auth/resetforgottenpassword"
  body:
    type: json
    data: |-
      {
        "resetToken": "PASTE_RESET_TOKEN_FROM_EMAIL",
        "newPassword": "NewPassword@123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
