info:
  name: get bookings by user
  type: http
  seq: 7

# NOTE: This endpoint expects the UserUid (GUID), not the readable UserId.
# The URL parameter is named 'userId' in the controller but the repository
# queries by UserUid (the GUID stored in the Bookings table).
http:
  method: GET
  url: "{{baseURL}}/api/vaxtrack/v1/booking/getbookingsbyuserid/22222222-2222-2222-2222-222222222222"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
