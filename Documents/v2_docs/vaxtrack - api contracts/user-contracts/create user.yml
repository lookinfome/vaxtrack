info:
  name: create user
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/vaxtrack/v1/user/createuser"
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Doe",
        "userBirthdate": "1995-05-20",
        "userGender": "Female",
        "userPhone": "9123456789",
        "userAddress": "MG Road, Pune",
        "userPinCode": "411001",
        "email": "jane.doe@example.com",
        "password": "Password@123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
